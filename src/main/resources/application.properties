spring.application.name=demo

# Default: disposable in-memory database for local development.
spring.datasource.url=jdbc:h2:mem:ticketingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# PostgreSQL template: comment out the H2 datasource and ddl-auto settings above,
# then uncomment these settings and provide the environment variables.
# spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=validate
# Apply a managed schema migration before starting with ddl-auto=validate.
